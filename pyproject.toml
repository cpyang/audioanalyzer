[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioanalyzer"
version = "0.2.0"
description = "Scan long-duration FLAC recordings for abnormal frequencies (tones, comb/periodic events, transients) with time and frequency annotation."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
dev = ["pytest>=7.4"]

[project.scripts]
audioanalyzer = "audioanalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["audioanalyzer*"]
